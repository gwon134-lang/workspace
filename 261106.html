<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캠퍼스링크 · 다음 경험을 연결하다</title><style>
:root{--navy:#132e3b;--teal:#007e72;--mint:#e7f5f0;--bg:#f4f7f8;--muted:#617780;--line:#dee7e9;--orange:#a94c13}*{box-sizing:border-box}body{margin:0;color:var(--navy);background:var(--bg);font-family:system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif;font-size:15px}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:48px;border:0;border-radius:12px;padding:12px 18px;background:white;color:var(--navy);font-weight:650}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #edab60;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--teal);color:white}.secondary{background:var(--mint);color:#00685f}.outline{border:1px solid var(--line)}.shell{display:grid;grid-template-columns:255px 1fr;min-height:100vh}aside{background:var(--navy);color:white;padding:34px 22px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{font-size:24px;font-weight:850;letter-spacing:-1px}.brand b{color:#80ddc4}.brand-sub{color:#b4c9cd;font-size:12px;margin:8px 0 38px}nav{display:grid;gap:7px}nav button{text-align:left;background:transparent;color:#c4d5d9;font-weight:500}nav button.active{background:#244b57;color:#fff}nav button span{margin-right:12px;color:#83d8c4}aside footer{margin-top:auto;color:#b4c9cd;font-size:12px;line-height:1.8;padding-top:32px}.top{height:80px;padding:0 40px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.top small{color:var(--muted)}.avatar{display:inline-flex;align-items:center;justify-content:center;background:var(--mint);color:var(--teal);width:38px;height:38px;border-radius:50%;font-weight:750;margin-right:10px}.wrap{max-width:1100px;padding:34px 40px 65px;margin:auto}.eyebrow{font-size:12px;color:var(--teal);font-weight:750;letter-spacing:2px}h1{font-size:30px;letter-spacing:-1.3px;margin:10px 0}h2{font-size:20px;margin:0 0 18px;letter-spacing:-.6px}h3{font-size:16px;margin:0 0 10px}p{line-height:1.75}.muted{color:var(--muted)}.lead{margin-top:8px;color:var(--muted);margin-bottom:28px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}.card{padding:25px;border:1px solid var(--line);background:#fff;border-radius:18px;margin-bottom:18px;box-shadow:0 3px 8px #15333d03}.tint{background:var(--mint);border-color:#cbe8de}.badge{display:inline-block;font-size:12px;border-radius:7px;padding:6px 9px;background:var(--mint);color:#006658;font-weight:650}.warning{background:#fff1e4;color:var(--orange)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.line{border-top:1px solid var(--line);margin:18px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}.meta small{display:block;color:var(--muted);margin-bottom:5px}.meta strong{font-size:15px}.steps{display:flex;gap:7px;margin-bottom:25px}.steps span{flex:1;font-size:12px;color:var(--muted);border-top:3px solid var(--line);padding-top:10px}.steps span.on{border-color:var(--teal);color:var(--teal);font-weight:750}label.field{display:block;font-weight:650;margin:20px 0 8px}input:not([type=checkbox]),textarea,select{width:100%;min-width:0;padding:14px;border:1px solid #cbd8dc;background:#fff;border-radius:10px;min-height:48px;color:var(--navy)}textarea{resize:vertical;min-height:110px;line-height:1.7}.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}.check{display:flex;gap:10px;align-items:start;line-height:1.7;margin:18px 0}.check input{width:20px;height:20px;accent-color:var(--teal);flex-shrink:0}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.chip{border:1px solid var(--line);border-radius:30px;min-height:44px;padding:9px 16px;font-size:13px}.chip.selected{background:var(--navy);color:white;border-color:var(--navy)}.flow{display:grid;gap:0;list-style:none;margin:0;padding:0}.flow li{padding:12px 0 12px 28px;position:relative;border-left:2px solid var(--line);margin-left:7px}.flow li:before{content:'';position:absolute;left:-7px;top:18px;border-radius:50%;width:12px;height:12px;background:#dce7e9;border:2px solid white}.flow li.done:before{background:var(--teal)}.flow small{display:block;margin-top:6px;color:var(--muted);font-size:12px}.success-mark{width:66px;height:66px;border-radius:50%;background:var(--mint);color:var(--teal);display:grid;place-items:center;font-size:32px;margin:8px auto 22px}.center{text-align:center}.big{font-size:32px;letter-spacing:-1px}.list-card{padding:20px 0;border-bottom:1px solid var(--line)}.list-card:last-child{border:0}.notification{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}.dot{width:9px;height:9px;background:var(--teal);border-radius:50%;margin-top:7px;flex-shrink:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{padding:12px 0;font-size:14px;border-radius:9px}.day.event{background:var(--teal);color:white}.day.muted{color:#77858b}.callout{padding:16px;border-radius:12px;background:#f4f7f8;font-size:13px;line-height:1.8}.bottom-note{font-size:12px;color:var(--muted);margin-top:24px}.mobile-menu{display:none}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:16px 24px;background:var(--navy);color:white;border-radius:12px;box-shadow:0 10px 30px #0002;z-index:30;max-width:90vw;font-size:14px}dialog{border:0;border-radius:22px;padding:28px;width:min(460px,calc(100% - 30px));color:var(--navy);box-shadow:0 20px 100px #0003}dialog::backdrop{background:#102c3b77}dialog .actions button{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f5f8f9;padding:16px 10px;border-radius:12px;text-align:center}.stat b{display:block;font-size:26px;margin:8px 0}.hidden{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:1fr}.support{order:2}.shell{grid-template-columns:210px 1fr}.wrap{padding:28px 24px}.top{padding:0 24px}}@media(max-width:650px){.shell{display:block}aside{display:none}.top{padding:0 18px;height:67px}.top small{display:none}.wrap{padding:27px 16px 42px}h1{font-size:26px}.card{padding:20px}.mobile-menu{display:block;padding:10px 16px;background:white;border-bottom:1px solid var(--line)}.mobile-menu select{font-size:14px;padding:8px;min-height:48px}.meta{gap:16px 10px}.actions button{flex:1;padding:12px}.steps span{font-size:11px}.row{flex-wrap:wrap}.big{font-size:27px}.top .brand{font-size:21px;color:var(--navy)}.stats .stat{padding:10px 4px}}
</style></head><body><div class="shell"><aside><div class="brand">캠퍼스<b>링크</b></div><div class="brand-sub">새로운 경험이 시작되는 연결</div><nav id="nav"></nav><footer>신규 경험 디자인 시안<br>시연 기준 2026.11.07<br>실제 개인정보를 입력하지 마세요.<br><button class="secondary" onclick="resetDemo()" style="margin-top:15px">시연 데이터 초기화</button></footer></aside><div><header class="top"><div class="brand">캠퍼스링크 <small>나의 다음 경험</small></div><div><span class="avatar" id="avatar">이</span><strong id="user">이지은</strong> <small> · 시연 데이터</small></div></header><div class="mobile-menu"><select id="mobileNav" aria-label="시연 화면 선택" onchange="go(Number(this.value))"></select></div><main class="wrap" id="app"></main></div></div><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalText"></div><div class="actions"><button class="outline" onclick="closeModal()">돌아가기</button><button class="primary" id="modalConfirm">확인</button></div></dialog><script>
const titles=['지원 프로필','업무 지원','내 지원 현황','참여 확정','활동 일정','알림·문의','새 업무 등록','참여자 공지'];
const initial={applied:false,confirmed:false,noticeRead:false,profile:false,published:false,sent:false,name:'이지은',phone:'010-1234-5678',intro:'사람들과 소통하는 일을 좋아합니다.',experience:'행사 안내 및 접수 업무에 참여한 경험이 있습니다.',school:'',major:'',jobTitle:'서울 캠퍼스 브랜드 홍보 운영',inquiry:''};let state;try{state={...initial,...JSON.parse(localStorage.getItem('campus-design')||'{}')}}catch(e){state={...initial}}let page=1,profileStep=0,jobStep=0,review=false,filter='전체';let modalAction=null;function save(){try{localStorage.setItem('campus-design',JSON.stringify(state))}catch(e){toast('저장하지 못했습니다. 작성한 내용은 유지됩니다.')}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function set(k,v){state[k]=v;save()}function toast(t){document.querySelector('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.role='status';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),3200)}function modal(t,body,button,fn){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').innerHTML=body;document.getElementById('modalConfirm').textContent=button;modalAction=fn;document.getElementById('modal').showModal()}function closeModal(){document.getElementById('modal').close()}document.getElementById('modalConfirm').onclick=()=>{closeModal();if(modalAction)modalAction()};function resetDemo(){modal('시연 데이터를 초기화할까요?','<p>이 브라우저에 저장한 시연 내용이 초기화됩니다.</p>','초기화',()=>{state={...initial};save();go(1)})}
function go(n){page=n;review=false;render();window.scrollTo(0,0)}function heading(k,t,d){return `<div class="eyebrow">${k}</div><h1>${t}</h1><p class="lead">${d}</p>`}function field(label,key,type='text'){return `<label class="field" for="${key}">${label}</label><input id="${key}" type="${type}" value="${safe(state[key]||'')}" oninput="set('${key}',this.value)">`}function summary(){return `<span class="badge">안내·접수</span><h3 style="margin-top:16px">서울 캠퍼스 브랜드 홍보 운영</h3><p class="hint">브라이트이벤트 · 검증 대행사</p><div class="meta"><div><small>근무일</small><strong>2026.11.21</strong></div><div><small>근무시간</small><strong>09:00~18:00</strong></div><div><small>근무 지역</small><strong>서울시 마포구 성산동</strong></div><div><small>휴게시간</small><strong>12:00~13:00</strong></div></div><div class="line"></div><div class="row"><span class="muted">일급</span><strong style="font-size:25px;color:var(--teal)">₩120,000</strong></div>`}function support(){return `<section class="card support">${summary()}<p class="hint">모든 정보는 프로토타입용 예시입니다.</p></section>`}function chips(items,sel=''){return `<div class="chips">${items.map(t=>`<button class="chip ${t===sel?'selected':''}" onclick="this.classList.toggle('selected')" aria-label="${t} 선택">${t}</button>`).join('')}</div>`}
function render(){document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})"><span>${String(i+1).padStart(2,'0')}</span>${t}</button>`).join('');document.getElementById('mobileNav').innerHTML=titles.map((t,i)=>`<option value="${i}" ${i===page?'selected':''}>${t}</option>`).join('');document.getElementById('user').textContent=page>=6?'김도윤':state.name;document.getElementById('avatar').textContent=page>=6?'김':'이';document.getElementById('app').innerHTML=[profile,apply,applications,participation,schedule,notifications,register,announce][page]();}
function profile(){const names=['기본 정보','학교 정보','경험·역량','희망 조건'];let body='';if(profileStep===0)body=field('이름','name')+field('연락처','phone','tel')+`<label class="field">활동 지역</label><input value="서울시 마포구" aria-label="활동 지역"><label class="field" for="intro">자기소개</label><textarea id="intro" oninput="set('intro',this.value)">${safe(state.intro)}</textarea>`;if(profileStep===1)body=field('학교명','school')+field('학과','major')+`<label class="field">재학 상태</label><select aria-label="재학 상태"><option>재학 중</option><option>휴학 중</option><option>졸업</option></select><label class="field">학교 이메일</label><input type="email" aria-label="학교 이메일" placeholder="학교 이메일 주소 입력"><button class="secondary" style="margin-top:12px" onclick="toast('시연용 인증번호는 123456입니다. 실제 메일은 발송되지 않습니다.')">인증 메일 받기</button><label class="field">인증번호</label><input id="code" inputmode="numeric" aria-label="인증번호"><button class="outline" style="margin-top:12px" onclick="toast(document.getElementById('code').value==='123456'?'학교 인증이 완료되었습니다.':'인증번호가 일치하지 않습니다.')">학교 인증하기</button><p class="hint">학교 인증과 프로필 검토는 별도의 절차입니다.</p>`;if(profileStep===2)body=`<label class="field">관심 경험 분야</label>${chips(['행사 안내','접수','브랜드 홍보','판촉','현장 운영'],'행사 안내')}<label class="field" for="experience">관련 경험</label><textarea id="experience" oninput="set('experience',this.value)">${safe(state.experience)}</textarea><label class="check"><input type="checkbox">아직 관련 경험이 없어요</label>`;if(profileStep===3)body=`<label class="field">활동 가능 지역</label>${chips(['서울','경기','인천'],'서울')}<label class="field">활동 가능 요일</label>${chips(['월','화','수','목','금','토','일'],'토')}<label class="field">희망 보수 기준</label><select aria-label="희망 보수"><option>일급 ₩100,000 이상</option><option>일급 ₩120,000 이상</option></select><div class="callout" style="margin-top:22px"><b>지원 시 공개되는 정보</b><br>예시 공개 범위: 지원한 대행사에 이름, 학교, 경험·역량을 공개합니다. 실제 공개 정책은 서비스 도입 시 확정합니다.</div>`;return heading('나를 소개하는 첫 단계','지원 프로필 만들기','한 번 작성하면 업무에 더 간편하게 지원할 수 있어요.')+`<div class="grid"><section class="card"><div class="steps">${names.map((n,i)=>`<span class="${i<=profileStep?'on':''}">${i+1}. ${n}</span>`).join('')}</div><h2>${names[profileStep]}</h2>${body}<div class="actions"><button class="outline" onclick="save();toast('임시 저장되었습니다.')">임시 저장</button>${profileStep?'<button class="outline" onclick="profileStep--;render()">이전</button>':''}<button class="primary" onclick="nextProfile()">${profileStep===3?'프로필 저장하기':'다음'}</button></div></section><section class="card tint"><span class="badge">나만의 지원 프로필</span><h2 style="margin-top:18px">경험이 없어도<br>괜찮아요.</h2><p class="muted">할 수 있는 일과 참여 가능한 조건부터 알려주세요. 첫 경험으로 이어지는 연결을 도와드릴게요.</p><p class="hint">실제 개인정보를 입력하지 마세요.</p></section></div>`}function nextProfile(){if(profileStep===0&&(!state.name.trim()||!/^010-\d{4}-\d{4}$/.test(state.phone))){toast('이름과 연락처 형식을 확인해주세요.');return}if(profileStep<3){profileStep++;render()}else{state.profile=true;save();toast('프로필이 저장되었습니다.');go(1)}}
function apply(){if(state.applied)return heading('지원 완료','좋은 연결을 기다려보세요','지원 이후의 과정도 캠퍼스링크에서 함께 확인하세요.')+`<section class="card center" style="max-width:650px;margin:auto;padding:40px"><div class="success-mark">✓</div><h2>지원이 접수되었습니다</h2><p class="muted">진행 상황은 내 지원 현황에서 확인할 수 있어요.</p><div class="callout">서울 캠퍼스 브랜드 홍보 운영<br>안내·접수 · 2026.11.21</div><div class="actions"><button class="primary" onclick="go(2)">지원 현황 보기</button></div></section>`;return heading('새로운 경험에 한 걸음','업무 지원하기','내 정보와 업무 조건을 확인한 후 지원서를 제출해주세요.')+`<div class="grid"><section class="card"><div class="steps"><span class="on">1. 지원서 작성</span><span class="${review?'on':''}">2. 제출 전 확인</span><span>3. 지원 완료</span></div><div class="row"><h2>${review?'제출 전 최종 확인':'지원할 프로필'}</h2><button class="secondary" onclick="go(0)">프로필 수정</button></div><div class="row"><div><span class="avatar">이</span><b>${safe(state.name)}</b></div><span class="badge">${state.profile?'프로필 작성 완료':'기본 프로필'}</span></div><p class="muted">${safe(state.intro)}</p><div class="line"></div><label class="field" for="answer">관련 업무 경험을 알려주세요.</label><textarea id="answer" ${review?'readonly':''} oninput="set('experience',this.value)">${safe(state.experience)}</textarea><p class="hint">경험이 없다면 지원 동기나 자신 있는 역량을 작성해주세요.</p><div class="callout">공개 대상: 브라이트이벤트<br>예시 공개 항목: 이름, 학교, 자기소개, 관련 경험</div><label class="check"><input type="checkbox" id="scheduleCheck" ${state.scheduleAgree?'checked':''} onchange="set('scheduleAgree',this.checked);validApply()">안내된 일정에 참여할 수 있습니다.</label><label class="check"><input type="checkbox" id="agree" ${state.agree?'checked':''} onchange="set('agree',this.checked);validApply()">업무 조건과 개인정보 공개 범위를 확인했습니다.</label><div class="actions">${review?'<button class="outline" onclick="review=false;render()">수정하기</button>':''}<button id="submitApply" class="primary" ${state.agree&&state.scheduleAgree?'':'disabled'} onclick="submitApply()">${review?'지원서 제출하기':'제출 내용 확인'}</button></div></section>${support()}</div>`}function validApply(){document.getElementById('submitApply').disabled=!(state.agree&&state.scheduleAgree)}function submitApply(){if(!state.experience.trim()){toast('관련 경험 또는 지원 동기를 작성해주세요.');return}if(!review){review=true;render();return}state.applied=true;save();render();toast('지원이 접수되었습니다.')}

function register(){if(state.published)return heading('모집 준비 완료','업무가 게시되었습니다','등록된 내용은 예시 데이터로 이 브라우저에만 저장됩니다.')+`<section class="card center"><div class="success-mark">✓</div><h2>${safe(state.jobTitle)}</h2><p class="muted">지원 접수를 시작할 준비가 되었습니다.</p><button class="primary" onclick="modal('기존 업무 관리 연결','<p>실제 앱에서는 해당 업무의 관리 화면으로 연결됩니다. 기존 화면은 이번 시안에서 제외했습니다.</p>','확인',()=>{})">등록한 업무 관리</button></section>`;const steps=['기본 정보','업무 조건','일정·장소','보수·지원','모집 설정','미리보기'];let body='';if(jobStep===0)body=field('업무 제목','jobTitle')+`<label class="field">업무 유형</label><select aria-label="업무 유형"><option>브랜드 홍보</option><option>행사 안내</option><option>판촉</option></select><label class="field">업무 소개</label><textarea oninput="set('jobDesc',this.value)" placeholder="참여자가 하게 될 일을 소개해주세요.">${safe(state.jobDesc||'캠퍼스 행사 현장에서 방문객 안내와 접수를 담당합니다.')}</textarea>`;if(jobStep===1)body=`<label class="field">모집 역할</label><input aria-label="모집 역할" value="안내·접수"><label class="field">필요 인원</label><input type="number" min="1" aria-label="필요 인원" value="10"><label class="field">복장 및 준비물</label><input aria-label="복장 및 준비물" value="검은색 긴바지, 편한 운동화">`;if(jobStep===2)body=`<label class="field">근무 날짜</label><input type="date" aria-label="근무 날짜" value="2026-11-21"><div class="meta"><div><label class="field">시작 시각</label><input type="time" aria-label="시작 시각" value="09:00"></div><div><label class="field">종료 시각</label><input type="time" aria-label="종료 시각" value="18:00"></div></div><label class="field">근무 장소</label><input aria-label="근무 장소" value="서울시 마포구 성산동">`;if(jobStep===3)body=`<label class="field">보수 기준</label><select aria-label="보수 기준"><option>일급</option><option>시급</option><option>총액</option></select><label class="field">금액</label><input aria-label="금액" type="number" min="1" value="120000"><label class="check"><input type="checkbox" checked>식사 제공</label><label class="check"><input type="checkbox">교통비 별도 지원</label><label class="field">지급 예정일</label><input aria-label="지급 예정일" type="date" value="2026-11-28">`;if(jobStep===4)body=`<label class="field">지원 마감일</label><input aria-label="지원 마감일" type="date" value="2026-11-15"><label class="field">참여 응답 기한</label><input aria-label="참여 응답 기한" type="date" value="2026-11-18"><label class="field">지원자 추가 질문</label><textarea>관련 업무 경험을 알려주세요.</textarea><div class="callout">취소 기준과 개인정보 공개 정책은 실제 서비스 도입 시 확정해야 합니다.</div>`;if(jobStep===5)body=`<span class="badge">게시 전 미리보기</span><h2 style="margin-top:20px">${safe(state.jobTitle)}</h2><p class="muted">${safe(state.jobDesc||'캠퍼스 행사 현장 안내 및 접수')}</p><div class="meta"><div><small>역할</small><b>안내·접수 10명</b></div><div><small>근무일</small><b>2026.11.21</b></div><div><small>시간</small><b>09:00~18:00</b></div><div><small>일급</small><b>₩120,000</b></div></div><p class="hint">이 디자인 시안은 기본 조건 예시를 사용합니다. 전체 필드 저장·검증은 후속 구현 대상입니다.</p>`;return heading('좋은 경험을 함께 만들어요','새 업무 등록','필요한 조건을 명확히 입력하면 더 적합한 인력을 만날 수 있어요.')+`<div class="grid"><section class="card"><div class="steps">${steps.map((s,i)=>`<span class="${i<=jobStep?'on':''}">${i+1}</span>`).join('')}</div><p class="hint">${jobStep+1} / 6 단계</p><h2>${steps[jobStep]}</h2>${body}<div class="actions"><button class="outline" onclick="save();toast('입력 중인 제목과 소개가 저장되었습니다.')">임시 저장</button>${jobStep?'<button class="outline" onclick="jobStep--;render()">이전</button>':''}<button class="primary" onclick="if(!state.jobTitle.trim()){toast('업무 제목을 입력해주세요.');return}if(jobStep<5){jobStep++;render()}else{state.published=true;save();render()}">${jobStep===5?'업무 게시하기':'다음'}</button></div></section><section class="card tint"><h2>명확한 조건이<br>좋은 연결을 만듭니다.</h2><p class="muted">역할, 시간, 보수를 구체적으로 안내하면 지원자의 선택과 현장 준비가 쉬워져요.</p><div class="line"></div><p class="hint">실제 게시나 외부 전송이 발생하지 않는 디자인 시안입니다.</p></section></div>`}
function announce(){return heading('함께 움직이는 현장','참여자에게 공지 보내기','필요한 사람에게 정확한 안내를 전달하세요.')+`<div class="grid"><section class="card"><h2>공지 작성</h2><p class="hint">서울 캠퍼스 브랜드 홍보 운영</p><label class="field">수신 대상</label><select aria-label="수신 대상"><option>참여 확정 인력 · 8명</option><option>선발 인력 · 10명</option><option>예비 인력 · 3명</option></select><label class="field">공지 유형</label><select aria-label="공지 유형"><option>일반 안내</option><option>중요 안내</option><option>일정 변경</option></select><label class="field" for="noticeTitle">제목</label><input id="noticeTitle" value="행사 당일 집결 안내"><label class="field" for="noticeBody">내용</label><textarea id="noticeBody">2026년 11월 21일 08:40까지 행사장 정문으로 모여주세요.\n복장은 검은색 긴바지와 편한 운동화입니다.</textarea><label class="check"><input type="checkbox" checked>참여자에게 확인 응답 요청</label><div class="actions"><button class="primary" onclick="sendNotice()">발송 전 확인</button></div><p class="hint">실제 메시지는 발송되지 않습니다.</p></section><section class="card"><h2>공지 전달 현황</h2>${state.sent?`<span class="badge">시연 발송 완료</span><div class="stats" style="margin-top:20px"><div class="stat">대상<b>8</b>명</div><div class="stat">완료<b>8</b>명</div><div class="stat">실패<b>0</b>명</div></div><div class="line"></div><div class="row"><span class="muted">읽음</span><b>0명</b></div><div class="row" style="margin-top:15px"><span class="muted">확인 완료</span><b>0명</b></div><p class="hint">발송 완료와 실제 열람·확인 응답은 별도 상태입니다.</p>`:`<div class="callout">아직 발송한 공지가 없습니다.<br>내용과 수신 대상을 확인한 후 발송해주세요.</div>`}</section></div>`}function sendNotice(){let t=document.getElementById('noticeTitle').value,b=document.getElementById('noticeBody').value;if(!t.trim()||!b.trim()){toast('공지 제목과 내용을 입력해주세요.');return}modal('선택한 대상에게 공지를 보내시겠어요?',`<span class="badge">참여 확정 인력 8명 · 예시</span><h3 style="margin-top:20px">${safe(t)}</h3><p>${safe(b).replace(/\n/g,'<br>')}</p><p class="hint">실제 발송은 발생하지 않습니다.</p>`,'공지 보내기',()=>{state.sent=true;save();render();toast('공지 발송이 완료되었습니다. 시연 결과입니다.')})}render();
</script></body></html>
